[project]
name = "mafia"
version = "0.1.0"
description = "Mafia: Chromium-backed real browser AIs steer (sibling to Chrime)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "playwright>=1.40",
]

[project.scripts]
mafia = "mafia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mafia*"]

[tool.setuptools.package-data]
mafia = [
  "chrome_skin/**/*.json",
  "chrome_skin/**/*.html",
  "chrome_skin/**/*.css",
  "chrome_skin/**/*.png",
]
