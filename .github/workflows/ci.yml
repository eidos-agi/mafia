name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
          python -m playwright install --with-deps chromium
      - name: smoke_spa
        run: python scripts/smoke_spa.py
        env:
          # force bundled chromium in CI
          MAFIA_CHANNEL: ""
      - name: smoke_node_ids
        run: python scripts/smoke_node_ids.py
      - name: smoke_sessions
        run: python scripts/smoke_sessions.py
      - name: smoke_ledger
        run: python scripts/smoke_ledger.py
      - name: smoke_learn
        run: python scripts/smoke_learn.py
      - name: api suite (dispatch)
        run: python scripts/run_api_suite.py
      - name: fleet N=10
        run: MAFIA_FLEET_N=10 python scripts/fleet_smoke.py
      - name: smoke_serve_n10
        run: python scripts/smoke_serve_n10.py
